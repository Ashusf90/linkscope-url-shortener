services:
  - type: web
    name: linkscope-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: DEMO_EMAIL
        value: demo@example.com
      - key: DEMO_PASSWORD
        sync: false
